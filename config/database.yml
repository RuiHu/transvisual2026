default: &default
  adapter: postgresql
  encoding: unicode
  # Replay concurrency (12) must stay below the pool (25), otherwise the load
  # generator starves the application and produces false "connection timeout" failures.
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 25) %>
  host: <%= ENV.fetch("DB_HOST", "db") %>
  port: <%= ENV.fetch("DB_PORT", 5432) %>
  username: <%= ENV.fetch("DB_USER", "postgres") %>
  password: <%= ENV.fetch("DB_PASSWORD", "postgres") %>

development:
  <<: *default
  database: app_development

test:
  <<: *default
  database: app_test

production:
  <<: *default
  database: app_production
